openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API "ООО <Ромашка>"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/get_default_report:
    get:
      summary: Получить отчет по сущности
      description: Генерирует отчет для конкретного объекта по его уникальному коду.
      operationId: main.get_default_report
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: Ключ сущности (например, nomenclature, group).
        - name: unique_code
          in: query
          required: true
          schema:
            type: string
          description: Уникальный код конкретного объекта.
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain: 
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Отсутствует параметр entity"
        '500':
          description: Внутренняя ошибка сервера.
          content:
            text/plain:
              schema:
                type: string
              example: "Ошибка: Невозможно получить требуемый отчет!"

  /api/get_entities:
    get:
      summary: Получить список доменных сущностей
      description: Возвращает список всех доступных ключей (типов моделей), которые есть в хранилище.
      operationId: main.get_entities
      responses:
        '200':
          description: Список ключей сущностей в формате JSON.
          content:
            text/json: 
              schema:
                type: array
                items:
                  type: string
              example: ["range_model", "group_model", "storage_model", "nomenclature_model", "receipt_model"]
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: "Ошибка: Невозможно получить список доменных сущностей!"

  /api/reports/formats:
    get:
      summary: Получить список всех форматов для построения отчетов
      operationId: main.get_report_formats
      responses:
        '200':
          description: Список форматов отчетов в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["txt", "csv", "markdown", "xml", "html"]
  /api/entity/{entity_type}:
    post:
      summary: Создать новую доменную сущность
      operationId: Src.Logics.entity_controller.create_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
          description: Тип сущности (warehouse, group, unit, nomenclature, recipe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сущность успешно создана
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Ошибка валидации или дубликат кода
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Неизвестный тип сущности
          content:
            application/json:
              schema:
                type: object

  /api/entity/{entity_type}/{entity_id}:
    get:
      summary: Получить доменную сущность по коду (ID)
      operationId: Src.Logics.entity_controller.get_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные сущности в формате JSON
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                type: object

    put:
      summary: Обновить доменную сущность
      operationId: Src.Logics.entity_controller.update_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Сущность успешно обновлена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Ошибка валидации или запрет смены кода связанной сущности
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                type: object

    delete:
      summary: Удалить доменную сущность
      operationId: Src.Logics.entity_controller.delete_entity
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Сущность успешно удалена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Запрещено удалять сущность, связанную с другими данными
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                type: object              